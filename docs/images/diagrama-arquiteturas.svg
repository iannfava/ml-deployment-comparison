<svg viewBox="0 0 1820 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Modelo treinado -->
  <rect x="60" y="240" width="370" height="140" rx="14" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/>
  <text x="245" y="300" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">Modelo treinado</text>
  <text x="245" y="330" text-anchor="middle" font-size="19" fill="#1e293b">Pipeline .pkl</text>
  <text x="245" y="356" text-anchor="middle" font-size="15" fill="#475569">(encoder + classificador)</text>

  <!-- Linha vertical de distribuição -->
  <path d="M 430 310 L 530 310" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 530 140 L 530 480" stroke="#475569" stroke-width="2" fill="none"/>

  <!-- Seta para Batch -->
  <path d="M 530 140 L 660 140" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- Seta para API -->
  <path d="M 530 480 L 660 480" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Batch (Databricks) -->
  <rect x="660" y="55" width="510" height="170" rx="14" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
  <text x="690" y="100" font-size="23" font-weight="bold" fill="#14532d">Batch (Databricks)</text>
  <text x="690" y="135" font-size="17" fill="#14532d">Previsão diária em massa</text>
  <text x="690" y="160" font-size="17" fill="#14532d">Sem necessidade de resposta imediata</text>
  <text x="690" y="195" font-size="15" fill="#166534" font-weight="bold">✓ Completo — 157.100 registros validados</text>

  <text x="1210" y="120" font-size="17" fill="#374151">Grandes volumes,</text>
  <text x="1210" y="145" font-size="17" fill="#374151">sem urgência</text>

  <!-- API + Interface -->
  <rect x="660" y="395" width="510" height="170" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="690" y="440" font-size="23" font-weight="bold" fill="#1e3a8a">API + Interface</text>
  <text x="690" y="470" font-size="17" fill="#1e3a8a">Docker → Render</text>
  <text x="690" y="495" font-size="17" fill="#1e3a8a">Uso interativo, resposta em tempo real</text>
  <text x="690" y="535" font-size="15" fill="#1e40af" font-weight="bold">✓ Completo — ao vivo no Render</text>

  <text x="1210" y="460" font-size="17" fill="#374151">Latência baixa,</text>
  <text x="1210" y="485" font-size="17" fill="#374151">um cliente por vez</text>
</svg>
