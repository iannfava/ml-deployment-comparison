<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#5f6b7a"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="#ffffff"/>

  <!-- Modelo central -->
  <rect x="40" y="170" width="180" height="90" rx="10" fill="#eef2f7" stroke="#3b4a5a" stroke-width="2"/>
  <text x="130" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Modelo treinado</text>
  <text x="130" y="228" text-anchor="middle" font-size="14" fill="#4b5563">Pipeline .pkl</text>
  <text x="130" y="246" text-anchor="middle" font-size="11" fill="#6b7280">(encoder + classificador)</text>

  <!-- Linhas conectando ao ponto de ramificação -->
  <line x1="220" y1="215" x2="270" y2="215" stroke="#5f6b7a" stroke-width="2"/>
  <line x1="270" y1="215" x2="270" y2="50" stroke="#5f6b7a" stroke-width="2"/>
  <line x1="270" y1="215" x2="270" y2="380" stroke="#5f6b7a" stroke-width="2"/>
  <line x1="270" y1="50" x2="330" y2="50" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="270" y1="215" x2="330" y2="215" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="270" y1="380" x2="330" y2="380" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Deploy 1: Batch -->
  <rect x="330" y="10" width="250" height="80" rx="10" fill="#e6f4ea" stroke="#2e7d46" stroke-width="2"/>
  <text x="355" y="35" font-size="14" font-weight="bold" fill="#1e4620">Batch (Databricks)</text>
  <text x="355" y="55" font-size="12" fill="#2f4f33">Previsão diária em massa</text>
  <text x="355" y="72" font-size="12" fill="#2f4f33">Sem necessidade de resposta imediata</text>

  <!-- Deploy 2: API -->
  <rect x="330" y="175" width="250" height="80" rx="10" fill="#e6f0fa" stroke="#1d5fa8" stroke-width="2"/>
  <text x="355" y="200" font-size="14" font-weight="bold" fill="#0f3866">API + Interface</text>
  <text x="355" y="220" font-size="12" fill="#22496e">Docker → Render</text>
  <text x="355" y="237" font-size="12" fill="#22496e">Uso interativo, resposta em tempo real</text>

  <!-- Deploy 3: Serverless -->
  <rect x="330" y="340" width="250" height="80" rx="10" fill="#f5f0e6" stroke="#9a7b1f" stroke-width="2"/>
  <text x="355" y="365" font-size="14" font-weight="bold" fill="#5c4813">Serverless (Azure Functions)</text>
  <text x="355" y="385" font-size="12" fill="#6b5620">Tráfego esparso/imprevisível</text>
  <text x="355" y="402" font-size="12" fill="#6b5620">Não validado em produção</text>

  <!-- Legendas de cenário à direita -->
  <text x="610" y="50" font-size="11" fill="#6b7280">Grandes volumes,</text>
  <text x="610" y="65" font-size="11" fill="#6b7280">sem urgência</text>

  <text x="610" y="215" font-size="11" fill="#6b7280">Latência baixa,</text>
  <text x="610" y="230" font-size="11" fill="#6b7280">um cliente por vez</text>

  <text x="610" y="380" font-size="11" fill="#6b7280">Picos irregulares,</text>
  <text x="610" y="395" font-size="11" fill="#6b7280">custo sob demanda</text>
</svg>
