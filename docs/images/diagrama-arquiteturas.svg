<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 770" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1280" height="770" fill="#ffffff"/>
  <text x="640" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">Um modelo, duas formas de deploy</text>

  <!-- MODELO -->
  <rect x="16" y="285" width="282" height="230" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="157" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">shopping_preference_model.pkl</text>
  <text x="157" y="342" text-anchor="middle" font-size="13" fill="#334155">Pipeline scikit-learn</text>
  <text x="157" y="372" text-anchor="middle" font-size="13" fill="#334155">22 numéricas → passthrough</text>
  <text x="157" y="394" text-anchor="middle" font-size="13" fill="#334155">gender, city_tier → TargetEncoder</text>
  <text x="157" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">→ LGBMClassifier</text>
  <text x="157" y="455" text-anchor="middle" font-size="12" fill="#64748b">mesmo arquivo nos 2 deploys</text>
  <text x="157" y="473" text-anchor="middle" font-size="12" fill="#64748b">(hash SHA256 idêntico)</text>
  <text x="157" y="497" text-anchor="middle" font-size="12" fill="#64748b">modelo fornecido pelo curso</text>

  <path d="M298,350 L318,240" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#seta)"/>
  <path d="M298,450 L318,560" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#seta)"/>

  <!-- DEPLOY 1 -->
  <rect x="320" y="70" width="935" height="305" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="342" y="100" font-size="18" font-weight="bold" fill="#14532d">Deploy 1 — Batch agendado · Databricks Free Edition (Serverless)</text>
  <text x="342" y="123" font-size="13" fill="#166534">Job com 2 tarefas, agendado a cada minuto (demonstração) · 161.200 previsões sobre dados sintéticos, 04–08/09/2026</text>

  <path d="M445,185 V150 H1090 V160" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#seta)"/>
  <text x="767" y="145" text-anchor="middle" font-size="12" fill="#166534">inferencia só roda depois de gerar_dados terminar</text>

  <rect x="345" y="185" width="200" height="75" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="445" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Tarefa 1: gerar_dados</text>
  <text x="445" y="228" text-anchor="middle" font-size="12" fill="#334155">gerar_dados_oficial.ipynb</text>
  <text x="445" y="247" text-anchor="middle" font-size="12" fill="#334155">100 clientes sintéticos</text>

  <rect x="615" y="165" width="270" height="190" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="750" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">PostgreSQL (Render)</text>
  <rect x="635" y="198" width="230" height="48" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="750" y="227" text-anchor="middle" font-size="12" fill="#1e3a8a">consumer_shopping_input</text>
  <rect x="635" y="285" width="230" height="48" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="750" y="314" text-anchor="middle" font-size="12" fill="#1e3a8a">shopping_preference_predictions</text>

  <rect x="960" y="165" width="275" height="190" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="1097" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Tarefa 2: inferencia</text>
  <text x="1097" y="210" text-anchor="middle" font-size="12" fill="#334155">inferencia.ipynb</text>
  <text x="978" y="238" font-size="12" fill="#334155">1. lê só clientes sem previsão</text>
  <text x="978" y="255" font-size="12" fill="#64748b">    (LEFT JOIN … IS NULL)</text>
  <text x="978" y="278" font-size="12" fill="#334155">2. joblib.load(.pkl)</text>
  <text x="978" y="300" font-size="12" fill="#334155">3. predict + predict_proba</text>
  <text x="978" y="322" font-size="12" fill="#334155">4. grava em modo append</text>

  <path d="M545,222 L633,222" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#seta)"/>
  <text x="589" y="214" text-anchor="middle" font-size="11" fill="#334155">append</text>
  <path d="M865,222 L958,222" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#seta)"/>
  <text x="913" y="214" text-anchor="middle" font-size="11" fill="#334155">lê pendentes</text>
  <path d="M960,309 L867,309" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#seta)"/>
  <text x="913" y="301" text-anchor="middle" font-size="11" fill="#334155">append</text>
  <text x="787" y="366" text-anchor="middle" font-size="11" fill="#64748b">leitura e escrita via Spark: spark.read / write.format("postgresql")</text>

  <!-- DEPLOY 2 -->
  <rect x="320" y="400" width="935" height="315" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="342" y="430" font-size="18" font-weight="bold" fill="#4c1d95">Deploy 2 — API + interface · Docker no Render (plano Free)</text>
  <text x="342" y="453" font-size="13" fill="#5b21b6">Imagem python:3.10-slim + libgomp1 · versões do treino fixadas no requirements.txt</text>

  <rect x="345" y="535" width="165" height="80" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="427" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">Usuário</text>
  <text x="427" y="590" text-anchor="middle" font-size="12" fill="#334155">navegador</text>

  <rect x="575" y="475" width="660" height="220" rx="12" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="595" y="498" font-size="12" font-weight="bold" fill="#5b21b6">1 container · o CMD do Dockerfile sobe os 2 processos</text>

  <rect x="600" y="515" width="255" height="130" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="727" y="540" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">Streamlit</text>
  <text x="727" y="562" text-anchor="middle" font-size="12" fill="#334155">streamlit_app.py</text>
  <text x="727" y="584" text-anchor="middle" font-size="12" fill="#334155">porta ${PORT}</text>
  <text x="727" y="610" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">PÚBLICA</text>
  <text x="727" y="628" text-anchor="middle" font-size="11" fill="#64748b">(única porta que o Render expõe)</text>

  <rect x="955" y="515" width="255" height="130" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="1082" y="540" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">FastAPI</text>
  <text x="1082" y="562" text-anchor="middle" font-size="12" fill="#334155">app.py · joblib.load no módulo</text>
  <text x="1082" y="584" text-anchor="middle" font-size="12" fill="#334155">GET /health · POST /predict</text>
  <text x="1082" y="610" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">porta 8000 · INTERNA</text>
  <text x="1082" y="628" text-anchor="middle" font-size="11" fill="#64748b">(não acessível de fora)</text>

  <path d="M510,575 L598,575" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#seta)"/>
  <text x="554" y="567" text-anchor="middle" font-size="11" fill="#334155">HTTPS</text>
  <path d="M855,565 L953,565" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#seta)"/>
  <text x="905" y="557" text-anchor="middle" font-size="11" fill="#334155">POST /predict</text>
  <path d="M955,605 L857,605" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#seta)"/>
  <text x="905" y="597" text-anchor="middle" font-size="11" fill="#334155">JSON</text>

  <text x="905" y="672" text-anchor="middle" font-size="12" fill="#5b21b6">Streamlit chama a API pelo endereço em API_URL (padrão: http://127.0.0.1:8000, o próprio container)</text>

  <text x="640" y="752" text-anchor="middle" font-size="12" fill="#64748b">Nomes de arquivos, tabelas e portas conferidos no código, no Databricks e no banco em 30/09/2026.</text>
</svg>
